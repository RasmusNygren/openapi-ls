[package]
name = "openapi-ls"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A small language server for OpenAPI reference navigation"
license = "MIT"
repository = "https://github.com/RasmusNygren/openapi-ls"
publish = false

[package.metadata.dist]
dist = true

[dependencies]
lsp-server = "0.10"
lsp-types = "0.97"
percent-encoding = "2"
serde_json = "1"
serde-saphyr = "1.3"
tree-sitter = "0.27"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
url = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.dist]
inherits = "release"
lto = "thin"
