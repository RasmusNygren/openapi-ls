name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      plan:
        description: Release plan supplied by cargo-dist
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
